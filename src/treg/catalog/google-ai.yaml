provider: google-ai
source:
  docs: https://ai.google.dev/gemini-api/docs/image-generation
  openapi: null
  curated: 2026-09-29
pricing_url: https://ai.google.dev/gemini-api/docs/pricing
proposed_capabilities:
  image-gen.gemini-3-1-flash-image.generate: "Gemini 3.1 Flash Image (Nano Banana 2)"
  image-gen.gemini-3-1-flash-lite-image.generate: "Gemini 3.1 Flash Lite Image (Nano Banana 2 Lite)"
limits: "Synchronous: one generateContent call takes about 25-70 seconds and answers with the image inline as base64 (`candidates[0].content.parts[].inlineData.data`), not a URL. A 2K answer is about 9 MB and a 4K one about 23 MB, most of it a `thoughtSignature` that only multi-turn editing needs; add `fields=candidates(content(parts(text,inlineData)),finishReason),usageMetadata,modelVersion,responseId,promptFeedback` to receive about 4 MB (2K) instead. Rate limits and a spend cap per 10 minutes follow the Google Cloud billing account's tier; 429 RESOURCE_EXHAUSTED is that limit, 503 UNAVAILABLE is Google-side demand and is worth a later retry."
endpoints:
  - id: google-ai.image-gen.gemini-3-pro-image
    capability: image-gen.gemini-3-pro-image.generate
    platform: image-gen
    domain: models
    scope: any_account
    method: POST
    path: /models/{model}:generateContent
    name: "Google: Gemini 3 Pro Image (Nano Banana Pro)"
    summary: "Generate or edit one image with Gemini 3 Pro Image at 1K, 2K or 4K on Google's own API, from a prompt and optional reference image URLs; the image returns inline as base64."
    # The image arrives inline, so a 2K/4K answer is far above the 8 MiB settlement buffer: the
    # body is read to disk and settled from Google's own token meters.
    spooled_response: true
    input:
      pathParams:
        model: {type: string, required: true, enum: [gemini-3-pro-image, gemini-3-pro-image-preview], example: gemini-3-pro-image, note: "gemini-3-pro-image is the stable model; the -preview alias is the same model at the same price."}
      queryParams:
        fields: {type: string, required: false, example: "candidates(content(parts(text,inlineData)),finishReason),usageMetadata,modelVersion,responseId,promptFeedback", note: "Google's partial-response mask. The example drops the multi-megabyte thoughtSignature and roughly halves the answer; keep usageMetadata in any mask you send."}
      body:
        contents:
          type: array
          required: true
          example: [{parts: [{text: "A clean editorial illustration of a paper airplane."}]}]
          note: "One user turn: {parts: [{text: prompt}, ...references]}. A reference image is {fileData: {mimeType: image/png, fileUri: <public https URL>}} (Google fetches it; `treg host <file>` prints a URL that works) or {inlineData: {mimeType, data: <base64>}} (a 10 MB request carrying a 7.5 MB image worked live). Up to 14 references; each bills 258 input tokens whatever its size."
        generationConfig:
          type: object
          required: true
          properties:
            responseModalities: {type: array, required: false, example: [IMAGE], note: "[IMAGE] for the image alone. [TEXT, IMAGE] permits a text part but does not guarantee one: a live [TEXT, IMAGE] call asking for a one-sentence description returned only the image."}
            imageConfig:
              type: object
              required: false
              properties:
                imageSize: {type: string, required: false, default: 1K, enum: [1K, 2K, 4K], example: 2K, note: "Uppercase K. 1K and 2K bill the same 1,120 output tokens, 4K bills 2,000."}
                aspectRatio: {type: string, required: false, enum: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"], example: "1:1", note: "Omitted, the model picks the frame from the prompt (a live call without it returned 1408x768). Pass it whenever the output size matters."}
      bodyType: json
    test_request:
      pathParams: {model: gemini-3-pro-image}
      queryParams: {fields: "candidates(content(parts(text,inlineData)),finishReason),usageMetadata,modelVersion,responseId,promptFeedback"}
      body: {contents: [{parts: [{text: "A clean editorial illustration of a paper airplane."}]}], generationConfig: {responseModalities: [IMAGE], imageConfig: {imageSize: 1K, aspectRatio: "1:1"}}}
    cost:
      type: per_success
      table:
        - {when: {body.generationConfig.imageConfig.imageSize: 1K}, value: 0.15}
        - {when: {body.generationConfig.imageConfig.imageSize: 2K}, value: 0.15}
        - {when: {body.generationConfig.imageConfig.imageSize: 4K}, value: 0.26}
      fallback: {value: 0.26, note: "One 4K image with its prompt, thinking and reference-image tokens; the reported token meters settle."}
      currency: USD
      settle: usage
      usage:
        unit: usd
        terms:
          - {path: usageMetadata.promptTokenCount, rate: 0.000002}
          - {path: usageMetadata.candidatesTokenCount, rate: 0.000012}
          - {path: usageMetadata.thoughtsTokenCount, rate: 0.000012}
          - {path: "usageMetadata.candidatesTokensDetails[modality=IMAGE].tokenCount", rate: 0.000108}
      source: docs
      source_url: https://ai.google.dev/gemini-api/docs/pricing
      checked: 2026-09-29
      confidence: documented
      note: "Token-metered at Google's paid-tier rates: input $2/M, text and thinking output $12/M, image output $120/M (the image term adds $108/M on top of candidatesTokenCount, which already counts it at $12/M). One 1K or 2K image is 1,120 image tokens ($0.1344), a 4K image 2,000 ($0.24); a reference image adds about 258 input tokens. The row is the hold; usageMetadata settles. A blocked image answers HTTP 200 with finishReason IMAGE_SAFETY, empty content and no image: live, it settled its prompt and thinking tokens only ($0.003956), not the hold. Check finishReason before reading parts."
    verified: 2026-09-29
    example_response: examples/google-ai.image-gen.gemini-3-pro-image.json
    docs_url: https://ai.google.dev/gemini-api/docs/image-generation

